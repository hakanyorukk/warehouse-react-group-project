function getStock(movements, products) {
  const totals = {};
  products.forEach(p => totals[p.id] = 0);
  movements.forEach(m => {
    if (m.movement_type === "IN")  totals[m.product_id] += m.quantity;
    if (m.movement_type === "OUT") totals[m.product_id] -= m.quantity;
  });
  return totals;
}

              <div style={{ fontSize: 12, color: "rgba(255,255,255,0.7)", letterSpacing: "0.05em", textTransform: "uppercase", marginTop: 2 }}>Modules</div>
            </div>
            <div>
              <div style={{ fontFamily: "var(--font-head)", fontSize: 26, fontWeight: 600 }}>Real-time</div>

            <div>
              <div style={{ fontFamily: "var(--font-head)", fontSize: 26, fontWeight: 600 }}>CSV</div>
              <div style={{ fontSize: 12, color: "rgba(255,255,255,0.7)", letterSpacing: "0.05em", textTransform: "uppercase", marginTop: 2 }}>Reports export</div>

              Welcome back

              style={{ ...btnPrimary, width: "100%", padding: "12px", fontSize: 15, opacity: loading ? 0.7 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
              {loading ? "Signing in…" : <>Sign in <Icon name="arrow" size={15} /></>}

            </div>

        </div>
      </div>
    </div>
  );
}

// PAGE: Dashboard
// ════════════════════════════════════════════════════════════════════════════
function DashboardPage({ products, movements, setPage }) {
  const stock = getStock(movements, products);
  const lowStock = products.filter(p => stock[p.id] <= p.min_stock);
  const totalIn  = movements.filter(m => m.movement_type === "IN").reduce((s, m) => s + m.quantity, 0);
  const totalOut = movements.filter(m => m.movement_type === "OUT").reduce((s, m) => s + m.quantity, 0);
  const recent   = [...movements].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 6);

  return (
    <div className="fade-in">
      <PageHeader
        title={"Welcome back, " + CURRENT_USER.full_name.split(" ")[0]}
        subtitle={new Date().toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long", year:"numeric" })}
        action={
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={() => setPage("writedown")} className="btn-secondary" style={btnSecondary}>− Write-Down</button>
            <button onClick={() => setPage("entry")}     className="btn-primary"   style={{ ...btnPrimary, display: "flex", alignItems: "center", gap: 6 }}>
              <Icon name="plus" size={14} /> New Entry
            </button>
          </div>
        }
      />

      <div style={{ display: "flex", gap: 16, marginBottom: 24, flexWrap: "wrap" }}>
        <StatCard label="Products"    value={products.length} icon="products" sub={`across ${CATEGORIES.length} categories`} />
        <StatCard label="Total In"    value={totalIn}  accent="var(--c-success)" icon="entry"     sub="all-time inbound" />
        <StatCard label="Total Out"   value={totalOut} accent="var(--c-danger)"  icon="writedown" sub="all-time outbound" />
        <StatCard label="Low Stock"   value={lowStock.length}
          accent={lowStock.length > 0 ? "var(--c-warning)" : "var(--c-success)"}
          icon="bell"
          sub={lowStock.length > 0 ? "needs attention" : "all levels OK"} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 20 }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
            <div style={{ fontFamily: "var(--font-head)", fontSize: 15, fontWeight: 600, color: "var(--c-text)" }}>Recent activity</div>
            <button onClick={() => setPage("report")} style={{ background: "none", border: "none", color: "var(--c-primary)", fontSize: 12.5, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
              View all <Icon name="arrow" size={12} />
            </button>
          </div>
          <Table
            columns={[
              { key: "product", label: "Product" },
              { key: "type",    label: "Type"    },
              { key: "qty",     label: "Qty", right: true },
              { key: "date",    label: "Date"    },
              { key: "notes",   label: "Notes"   },
            ]}
            rows={recent.map(m => {
              const p = products.find(x => x.id === m.product_id);
              return {
                product: <span style={{ fontWeight: 500 }}>{p?.name || "—"}</span>,
                type: <Badge type={m.movement_type} />,
                qty: <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600, color: m.movement_type === "IN" ? "var(--c-success)" : "var(--c-danger)" }}>
                  {m.movement_type === "IN" ? "+" : "−"}{m.quantity}
                </span>,
                date: <span style={{ color: "var(--c-text-muted)", fontSize: 12.5 }}>{fmtDate(m.created_at)}</span>,
                notes: <span style={{ color: "var(--c-text-muted)", fontSize: 12.5 }}>{m.notes || "—"}</span>,
              };
            })}
          />
        </div>

        <div>
          <div style={{ fontFamily: "var(--font-head)", fontSize: 15, fontWeight: 600, color: "var(--c-text)", marginBottom: 10 }}>Stock alerts</div>
          {lowStock.length === 0 ? (
            <div style={{ background: "var(--c-primary-soft)", border: "1px solid #c8d8cc", borderRadius: "var(--r-lg)", padding: "20px 18px", textAlign: "center", color: "var(--c-primary)", fontSize: 13 }}>
              <Icon name="check" size={22} color="var(--c-primary)" /><br/>
              All stock levels are above their minimum thresholds.
            </div>
          ) : (
            <div style={{ background: "var(--c-surface)", borderRadius: "var(--r-lg)", border: "1px solid var(--c-border)", overflow: "hidden", boxShadow: "var(--shadow-sm)" }}>
              {lowStock.map((p, i) => (
                <div key={p.id} style={{
                  padding: "12px 16px",
                  borderBottom: i < lowStock.length - 1 ? "1px solid var(--c-border)" : "none",
                  display: "flex", alignItems: "center", gap: 12,
                }}>
                  <div style={{
                    width: 36, height: 36, borderRadius: 8,
                    background: stock[p.id] <= 0 ? "var(--c-danger-bg)" : "var(--c-warning-bg)",
                    display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                  }}>
                    <Icon name="warn" size={16} color={stock[p.id] <= 0 ? "var(--c-danger)" : "var(--c-warning)"} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 500 }}>{p.name}</div>
                    <div style={{ fontSize: 11.5, color: "var(--c-text-muted)", fontFamily: "var(--font-mono)", marginTop: 1 }}>{p.sku}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontFamily: "var(--font-head)", fontSize: 18, fontWeight: 600, color: stock[p.id] <= 0 ? "var(--c-danger)" : "var(--c-warning)", lineHeight: 1 }}>{stock[p.id]}</div>
                    <div style={{ fontSize: 11, color: "var(--c-text-muted)", marginTop: 3 }}>min {p.min_stock}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          <div style={{ marginTop: 22 }}>
            <div style={{ fontFamily: "var(--font-head)", fontSize: 15, fontWeight: 600, color: "var(--c-text)", marginBottom: 10 }}>Categories</div>
            <div style={{ background: "var(--c-surface)", borderRadius: "var(--r-lg)", border: "1px solid var(--c-border)", padding: "6px 0", boxShadow: "var(--shadow-sm)" }}>
              {CATEGORIES.map((c, i) => {
                const count = products.filter(p => p.category_id === c.id).length;
                const total = products.filter(p => p.category_id === c.id).reduce((s, p) => s + (stock[p.id] || 0), 0);
                return (
                  <div key={c.id} style={{
                    padding: "10px 16px",
                    display: "flex", alignItems: "center", justifyContent: "space-between",
                  }}>
                    <div>
                      <div style={{ fontSize: 13.5, fontWeight: 500 }}>{c.name}</div>
                      <div style={{ fontSize: 11.5, color: "var(--c-text-muted)" }}>{count} product{count !== 1 ? "s" : ""}</div>
                    </div>
                    <div style={{ fontFamily: "var(--font-mono)", fontSize: 13, fontWeight: 600, color: "var(--c-text)" }}>
                      {total}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// PAGE: Stock Entry
// ════════════════════════════════════════════════════════════════════════════
function StockEntryPage({ products, movements, setMovements, categories, showToast }) {
  const stock = getStock(movements, products);
  const [form, setForm] = useState({ product_id: "", quantity: "", supplier_id: "", notes: "" });
  const [errors, setErrors] = useState({});

  const selectedProduct  = products.find(p => p.id === parseInt(form.product_id));
  const selectedCategory = selectedProduct ? categories.find(c => c.id === selectedProduct.category_id) : null;

  const set = (k, v) => { setForm(f => ({ ...f, [k]: v })); setErrors(e => ({ ...e, [k]: "" })); };

  function validate() {
    const e = {};
    if (!form.product_id) e.product_id = "Please select a product";
    if (!form.quantity || parseInt(form.quantity) <= 0) e.quantity = "Enter a valid quantity (> 0)";
    return e;
  }

  function handleSubmit(e) {
    e.preventDefault();
    const errs = validate();
    if (Object.keys(errs).length) { setErrors(errs); return; }
    setMovements(m => [...m, {
      id: Date.now(),
      product_id: parseInt(form.product_id),
      supplier_id: form.supplier_id ? parseInt(form.supplier_id) : null,
      user_id: CURRENT_USER.id,
      movement_type: "IN",
      quantity: parseInt(form.quantity),
      created_at: new Date().toISOString(),
      notes: form.notes,
    }]);
    showToast(`Added ${form.quantity} × ${selectedProduct.name} to stock`, "success");
    setForm({ product_id: "", quantity: "", supplier_id: "", notes: "" });
  }

  return (
    <div className="fade-in">
      <PageHeader title="Stock Entry" subtitle="Record incoming goods. This increases stock levels." />
      <div style={{ display: "grid", gridTemplateColumns: "420px 1fr", gap: 24, alignItems: "start" }}>

        <div style={{ background: "var(--c-surface)", borderRadius: "var(--r-lg)", border: "1px solid var(--c-border)", padding: 24, boxShadow: "var(--shadow-sm)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20, paddingBottom: 14, borderBottom: "1px solid var(--c-border)" }}>
            <div style={{ width: 36, height: 36, borderRadius: 8, background: "var(--c-success-bg)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="entry" size={17} color="var(--c-success)" />
            </div>
            <div>
              <div style={{ fontFamily: "var(--font-head)", fontSize: 15, fontWeight: 600 }}>New Inbound Entry</div>
              <div style={{ fontSize: 12, color: "var(--c-text-muted)" }}>Record stock received from supplier</div>
            </div>
          </div>

          <form onSubmit={handleSubmit}>
            <FormField label="Product *" error={errors.product_id}>
              <select value={form.product_id} onChange={e => set("product_id", e.target.value)} style={inputStyle}>
                <option value="">— Select product —</option>
                {categories.map(cat => (
                  <optgroup key={cat.id} label={cat.name}>
                    {products.filter(p => p.category_id === cat.id).map(p => (
                      <option key={p.id} value={p.id}>{p.name} ({p.sku})</option>
                    ))}
                  </optgroup>
                ))}
              </select>
            </FormField>

            {selectedProduct && (
              <div style={{
                background: "var(--c-surface-alt)", border: "1px solid var(--c-border)",
                borderRadius: "var(--r-sm)", padding: "12px 14px", marginBottom: 16, fontSize: 13,
              }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 14px" }}>
                  <div><span style={{ color: "var(--c-text-soft)" }}>SKU:</span> <span style={{ fontFamily: "var(--font-mono)", fontWeight: 500 }}>{selectedProduct.sku}</span></div>
                  <div><span style={{ color: "var(--c-text-soft)" }}>Unit:</span> {selectedProduct.unit}</div>
                  <div><span style={{ color: "var(--c-text-soft)" }}>Category:</span> {selectedCategory?.name}</div>
                  <div><span style={{ color: "var(--c-text-soft)" }}>Current:</span> <strong>{stock[selectedProduct.id]}</strong></div>
                </div>
              </div>
            )}

            <FormField label={`Quantity ${selectedProduct ? `(${selectedProduct.unit})` : ""} *`} error={errors.quantity}>
              <input type="number" min="1" value={form.quantity} onChange={e => set("quantity", e.target.value)} placeholder="Enter quantity" style={inputStyle} />
            </FormField>

            {selectedProduct && form.quantity && parseInt(form.quantity) > 0 && (
              <div style={{
                background: "var(--c-primary-soft)", border: "1px solid #c8d8cc",
                borderRadius: "var(--r-sm)", padding: "10px 13px", marginBottom: 16,
                fontSize: 13, color: "var(--c-primary)",
                display: "flex", alignItems: "center", gap: 8,
              }}>
                <Icon name="trend" size={14} />
                New stock level: <strong>{stock[selectedProduct.id] + parseInt(form.quantity)} {selectedProduct.unit}</strong>
              </div>
            )}

            <FormField label="Supplier (optional)">
              <select value={form.supplier_id} onChange={e => set("supplier_id", e.target.value)} style={inputStyle}>
                <option value="">— Select supplier —</option>
                {SUPPLIERS.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </FormField>

            <FormField label="Notes (optional)">
              <textarea value={form.notes} onChange={e => set("notes", e.target.value)}
                placeholder="e.g. Delivery reference, condition notes…" rows={3}
                style={{ ...inputStyle, resize: "vertical" }} />
            </FormField>

            <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
              <button type="submit" className="btn-primary" style={{ ...btnPrimary, flex: 1 }}>Record Entry</button>
              <button type="button" className="btn-secondary" style={btnSecondary} onClick={() => { setForm({ product_id: "", quantity: "", supplier_id: "", notes: "" }); setErrors({}); }}>Clear</button>
            </div>
          </form>
        </div>

        <div>
          <div style={{ fontFamily: "var(--font-head)", fontSize: 15, fontWeight: 600, color: "var(--c-text)", marginBottom: 10 }}>Recent stock entries</div>
          <Table
            columns={[
              { key: "date",     label: "Date"     },
              { key: "product",  label: "Product"  },
              { key: "sku",      label: "SKU"      },
              { key: "qty",      label: "Qty", right: true },
              { key: "supplier", label: "Supplier" },
              { key: "notes",    label: "Notes"    },
            ]}
            rows={[...movements].filter(m => m.movement_type === "IN")
              .sort((a,b) => new Date(b.created_at)-new Date(a.created_at))
              .map(m => {
                const p = products.find(x => x.id === m.product_id);
                const s = SUPPLIERS.find(x => x.id === m.supplier_id);
                return {
                  date:     <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--c-text-muted)" }}>{fmtDateTime(m.created_at)}</span>,
                  product:  <span style={{ fontWeight: 500 }}>{p?.name}</span>,
                  sku:      <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--c-text-muted)" }}>{p?.sku}</span>,
                  qty:      <span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, color: "var(--c-success)" }}>+{m.quantity}</span>,
                  supplier: s?.name || <span style={{ color: "var(--c-text-soft)" }}>—</span>,
                  notes:    m.notes || <span style={{ color: "var(--c-text-soft)" }}>—</span>,
                };
              })}
            emptyMsg="No inbound entries yet"
          />
        </div>
      </div>
    </div>
  );
}

// PAGE: Write-Down
// ════════════════════════════════════════════════════════════════════════════
function WriteDownPage({ products, movements, setMovements, categories, showToast }) {
  const stock = getStock(movements, products);
  const [form, setForm] = useState({ product_id: "", quantity: "", notes: "" });
  const [errors, setErrors] = useState({});

  const selectedProduct  = products.find(p => p.id === parseInt(form.product_id));
  const selectedCategory = selectedProduct ? categories.find(c => c.id === selectedProduct.category_id) : null;
  const currentStock     = selectedProduct ? stock[selectedProduct.id] : 0;

  const set = (k, v) => { setForm(f => ({ ...f, [k]: v })); setErrors(e => ({ ...e, [k]: "" })); };

  function validate() {
    const e = {};
    if (!form.product_id) e.product_id = "Please select a product";
    const qty = parseInt(form.quantity);
    if (!form.quantity || qty <= 0) e.quantity = "Enter a valid quantity (> 0)";
    else if (selectedProduct && qty > currentStock) e.quantity = `Cannot exceed current stock (${currentStock} ${selectedProduct.unit})`;
    return e;
  }

  function handleSubmit(e) {
    e.preventDefault();
    const errs = validate();
    if (Object.keys(errs).length) { setErrors(errs); return; }
    setMovements(m => [...m, {
      id: Date.now(),
      product_id: parseInt(form.product_id),
      supplier_id: null,
      user_id: CURRENT_USER.id,
      movement_type: "OUT",
      quantity: parseInt(form.quantity),
      created_at: new Date().toISOString(),
      notes: form.notes,
    }]);
    showToast(`Written down ${form.quantity} × ${selectedProduct.name}`, "success");
    setForm({ product_id: "", quantity: "", notes: "" });
  }

  const qty = parseInt(form.quantity) || 0;
  const remaining = currentStock - qty;

  return (
    <div className="fade-in">
      <PageHeader title="Write-Down" subtitle="Record outgoing goods or stock reductions. This decreases stock levels." />
      <div style={{ display: "grid", gridTemplateColumns: "420px 1fr", gap: 24, alignItems: "start" }}>

        <div style={{ background: "var(--c-surface)", borderRadius: "var(--r-lg)", border: "1px solid var(--c-border)", padding: 24, boxShadow: "var(--shadow-sm)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20, paddingBottom: 14, borderBottom: "1px solid var(--c-border)" }}>
            <div style={{ width: 36, height: 36, borderRadius: 8, background: "var(--c-danger-bg)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="writedown" size={17} color="var(--c-danger)" />
            </div>
            <div>
              <div style={{ fontFamily: "var(--font-head)", fontSize: 15, fontWeight: 600 }}>New Write-Down</div>
              <div style={{ fontSize: 12, color: "var(--c-text-muted)" }}>Record stock issued, damaged, or removed</div>
            </div>
          </div>

          <form onSubmit={handleSubmit}>
            <FormField label="Product *" error={errors.product_id}>
              <select value={form.product_id} onChange={e => set("product_id", e.target.value)} style={inputStyle}>
                <option value="">— Select product —</option>
                {categories.map(cat => (
                  <optgroup key={cat.id} label={cat.name}>
                    {products.filter(p => p.category_id === cat.id).map(p => (
                      <option key={p.id} value={p.id}>{p.name} ({p.sku})</option>
                    ))}
                  </optgroup>
                ))}
              </select>
            </FormField>

            {selectedProduct && (
              <div style={{
                background: "var(--c-surface-alt)", border: "1px solid var(--c-border)",
                borderRadius: "var(--r-sm)", padding: "12px 14px", marginBottom: 16, fontSize: 13,
              }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 14px" }}>
                  <div><span style={{ color: "var(--c-text-soft)" }}>SKU:</span> <span style={{ fontFamily: "var(--font-mono)", fontWeight: 500 }}>{selectedProduct.sku}</span></div>
                  <div><span style={{ color: "var(--c-text-soft)" }}>Unit:</span> {selectedProduct.unit}</div>
                  <div><span style={{ color: "var(--c-text-soft)" }}>Category:</span> {selectedCategory?.name}</div>
                  <div><span style={{ color: "var(--c-text-soft)" }}>Available:</span> <strong style={{ color: currentStock <= selectedProduct.min_stock ? "var(--c-warning)" : "var(--c-success)" }}>{currentStock}</strong></div>
                </div>
              </div>
            )}

            <FormField label={`Quantity ${selectedProduct ? `(${selectedProduct.unit})` : ""} *`} error={errors.quantity}>
              <input type="number" min="1" value={form.quantity} onChange={e => set("quantity", e.target.value)} placeholder="Enter quantity" style={inputStyle} />
            </FormField>

            {selectedProduct && qty > 0 && qty <= currentStock && (
              <div style={{
                background: remaining <= selectedProduct.min_stock ? "var(--c-warning-bg)" : "var(--c-surface-alt)",
                border: `1px solid ${remaining <= selectedProduct.min_stock ? "#fde68a" : "var(--c-border)"}`,
                borderRadius: "var(--r-sm)", padding: "10px 13px", marginBottom: 16, fontSize: 13,
                color: remaining <= selectedProduct.min_stock ? "var(--c-warning)" : "var(--c-text)",
                display: "flex", alignItems: "center", gap: 8,
              }}>
                {remaining <= selectedProduct.min_stock && <Icon name="warn" size={14} />}
                Stock after: <strong>{remaining} {selectedProduct.unit}</strong>
                {remaining <= selectedProduct.min_stock && " — below minimum"}
              </div>
            )}

            <FormField label="Reason / Notes *">
              <textarea value={form.notes} onChange={e => set("notes", e.target.value)}
                placeholder="e.g. Issued to department, damaged, expired…" rows={3}
                style={{ ...inputStyle, resize: "vertical" }} />
            </FormField>

            <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
              <button type="submit" className="btn-danger" style={{ ...btnDanger, flex: 1 }}>Record Write-Down</button>
              <button type="button" className="btn-secondary" style={btnSecondary} onClick={() => { setForm({ product_id: "", quantity: "", notes: "" }); setErrors({}); }}>Clear</button>
            </div>
          </form>
        </div>

        <div>
          <div style={{ fontFamily: "var(--font-head)", fontSize: 15, fontWeight: 600, color: "var(--c-text)", marginBottom: 10 }}>Recent write-downs</div>
          <Table
            columns={[
              { key: "date",    label: "Date"    },
              { key: "product", label: "Product" },
              { key: "sku",     label: "SKU"     },
              { key: "qty",     label: "Qty", right: true },
              { key: "notes",   label: "Reason"  },
            ]}
            rows={[...movements].filter(m => m.movement_type === "OUT")
              .sort((a,b) => new Date(b.created_at)-new Date(a.created_at))
              .map(m => {
                const p = products.find(x => x.id === m.product_id);
                return {
                  date:    <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--c-text-muted)" }}>{fmtDateTime(m.created_at)}</span>,
                  product: <span style={{ fontWeight: 500 }}>{p?.name}</span>,
                  sku:     <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--c-text-muted)" }}>{p?.sku}</span>,
                  qty:     <span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, color: "var(--c-danger)" }}>−{m.quantity}</span>,
                  notes:   m.notes || <span style={{ color: "var(--c-text-soft)" }}>—</span>,
                };
              })}
            emptyMsg="No write-downs yet"
          />
        </div>
      </div>
    </div>
  );
}

// PAGE: Stock Report
// ════════════════════════════════════════════════════════════════════════════
function ReportPage({ products, movements, categories }) {
  const [filterProduct,  setFilterProduct]  = useState("");
  const [filterCategory, setFilterCategory] = useState("");
  const [filterFrom,     setFilterFrom]     = useState("");
  const [filterTo,       setFilterTo]       = useState("");
  const [filterType,     setFilterType]     = useState("");

  const filtered = useMemo(() => movements.filter(m => {
    if (filterProduct  && m.product_id !== parseInt(filterProduct))  return false;
    if (filterCategory) {
      const p = products.find(x => x.id === m.product_id);
      if (!p || p.category_id !== parseInt(filterCategory)) return false;
    }
    if (filterType && m.movement_type !== filterType) return false;
    if (filterFrom && new Date(m.created_at) < new Date(filterFrom)) return false;
    if (filterTo   && new Date(m.created_at) > new Date(filterTo + "T23:59:59")) return false;
    return true;
  }), [movements, filterProduct, filterCategory, filterType, filterFrom, filterTo]);

  const byProduct = useMemo(() => {
    const map = {};
    filtered.forEach(m => {
      if (!map[m.product_id]) map[m.product_id] = { in: 0, out: 0 };
      if (m.movement_type === "IN")  map[m.product_id].in  += m.quantity;
      if (m.movement_type === "OUT") map[m.product_id].out += m.quantity;
    });
    return map;
  }, [filtered]);

  const totalIn  = filtered.filter(m => m.movement_type === "IN").reduce((s, m) => s + m.quantity, 0);
  const totalOut = filtered.filter(m => m.movement_type === "OUT").reduce((s, m) => s + m.quantity, 0);

  function exportCSV() {
    const header = "Date,Product,SKU,Type,Quantity,Notes\n";
    const rows = filtered.map(m => {
      const p = products.find(x => x.id === m.product_id);
      return [fmtDateTime(m.created_at), p?.name || "", p?.sku || "", m.movement_type, m.quantity, m.notes || ""].join(",");
    }).join("\n");
    const blob = new Blob([header + rows], { type: "text/csv" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "stock_report.csv"; a.click();
  }

  const filteredProducts = filterCategory ? products.filter(p => p.category_id === parseInt(filterCategory)) : products;

  return (
    <div className="fade-in">
      <PageHeader title="Stock Report" subtitle="Filter and analyse stock movements" />

      <div style={{ background: "var(--c-surface)", borderRadius: "var(--r-lg)", border: "1px solid var(--c-border)", padding: "16px 20px", marginBottom: 20, boxShadow: "var(--shadow-sm)" }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: "var(--c-text-muted)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12 }}>Filters</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ flex: "1 1 160px" }}>
            <label style={{ fontSize: 12, fontWeight: 500, color: "var(--c-text-muted)", display: "block", marginBottom: 4 }}>Category</label>
            <select value={filterCategory} onChange={e => { setFilterCategory(e.target.value); setFilterProduct(""); }} style={inputStyle}>
              <option value="">All categories</option>
              {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div style={{ flex: "1 1 180px" }}>
            <label style={{ fontSize: 12, fontWeight: 500, color: "var(--c-text-muted)", display: "block", marginBottom: 4 }}>Product</label>
            <select value={filterProduct} onChange={e => setFilterProduct(e.target.value)} style={inputStyle}>
              <option value="">All products</option>
              {filteredProducts.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div style={{ flex: "1 1 120px" }}>
            <label style={{ fontSize: 12, fontWeight: 500, color: "var(--c-text-muted)", display: "block", marginBottom: 4 }}>Type</label>
            <select value={filterType} onChange={e => setFilterType(e.target.value)} style={inputStyle}>
              <option value="">IN + OUT</option>
              <option value="IN">IN only</option>
              <option value="OUT">OUT only</option>
            </select>
          </div>
          <div style={{ flex: "1 1 130px" }}>
            <label style={{ fontSize: 12, fontWeight: 500, color: "var(--c-text-muted)", display: "block", marginBottom: 4 }}>From</label>
            <input type="date" value={filterFrom} onChange={e => setFilterFrom(e.target.value)} style={inputStyle} />
          </div>
          <div style={{ flex: "1 1 130px" }}>
            <label style={{ fontSize: 12, fontWeight: 500, color: "var(--c-text-muted)", display: "block", marginBottom: 4 }}>To</label>
            <input type="date" value={filterTo} onChange={e => setFilterTo(e.target.value)} style={inputStyle} />
          </div>
          <button className="btn-secondary" onClick={() => { setFilterProduct(""); setFilterCategory(""); setFilterFrom(""); setFilterTo(""); setFilterType(""); }}
            style={{ ...btnSecondary, height: 40, whiteSpace: "nowrap" }}>Clear</button>
          <button className="btn-primary" onClick={exportCSV}
            style={{ ...btnPrimary, height: 40, display: "flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }}>
            <Icon name="export" size={14} /> Export CSV
          </button>
        </div>
      </div>

      <div style={{ display: "flex", gap: 14, marginBottom: 20, flexWrap: "wrap" }}>
        <StatCard label="Movements" value={filtered.length} />
        <StatCard label="Total IN"   value={totalIn}  accent="var(--c-success)" />
        <StatCard label="Total OUT"  value={totalOut} accent="var(--c-danger)"  />
        <StatCard label="Net Change" value={(totalIn - totalOut >= 0 ? "+" : "") + (totalIn - totalOut)}
          accent={totalIn - totalOut >= 0 ? "var(--c-success)" : "var(--c-danger)"} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
        <div>
          <div style={{ fontFamily: "var(--font-head)", fontSize: 15, fontWeight: 600, color: "var(--c-text)", marginBottom: 10 }}>Summary by product</div>
          <Table
            columns={[
              { key: "product", label: "Product" },
              { key: "in",      label: "IN",   right: true },
              { key: "out",     label: "OUT",  right: true },
              { key: "net",     label: "Net",  right: true },
            ]}
            rows={Object.entries(byProduct).map(([pid, d]) => {
              const p = products.find(x => x.id === parseInt(pid));
              const net = d.in - d.out;
              return {
                product: <span style={{ fontWeight: 500 }}>{p?.name || "—"}</span>,
                in:  <span style={{ fontFamily: "var(--font-mono)", color: "var(--c-success)", fontWeight: 600 }}>{d.in}</span>,
                out: <span style={{ fontFamily: "var(--font-mono)", color: "var(--c-danger)",  fontWeight: 600 }}>{d.out}</span>,
                net: <span style={{ fontFamily: "var(--font-mono)", color: net >= 0 ? "var(--c-success)" : "var(--c-danger)", fontWeight: 700 }}>{net >= 0 ? "+" : ""}{net}</span>,
              };
            })}
            emptyMsg="No movements match filters"
          />
        </div>

        <div>
          <div style={{ fontFamily: "var(--font-head)", fontSize: 15, fontWeight: 600, color: "var(--c-text)", marginBottom: 10 }}>Movement log ({filtered.length})</div>
          <div style={{ maxHeight: 460, overflowY: "auto", borderRadius: "var(--r-lg)" }}>
            <Table
              columns={[
                { key: "date",    label: "Date"    },
                { key: "product", label: "Product" },
                { key: "type",    label: "Type"    },
                { key: "qty",     label: "Qty", right: true },
              ]}
              rows={[...filtered].sort((a,b) => new Date(b.created_at)-new Date(a.created_at)).map(m => {
                const p = products.find(x => x.id === m.product_id);
                return {
                  date:    <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--c-text-muted)" }}>{fmtDate(m.created_at)}</span>,
                  product: p?.name,
                  type:    <Badge type={m.movement_type} />,
                  qty:     <span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, color: m.movement_type === "IN" ? "var(--c-success)" : "var(--c-danger)" }}>
                    {m.movement_type === "IN" ? "+" : "−"}{m.quantity}
                  </span>,
                };
              })}
              emptyMsg="No movements match filters"
            />
          </div>
        </div>
      </div>
    </div>
  );
}

// PAGE: Products
// ════════════════════════════════════════════════════════════════════════════
function ProductsPage({ products, setProducts, movements, categories }) {
  const stock = getStock(movements, products);
  const [search, setSearch] = useState("");
  const [filterCat, setFilterCat] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ sku: "", name: "", category_id: "", unit: "pcs", min_stock: "5" });
  const [errors, setErrors] = useState({});

  const filtered = products.filter(p => {
    if (filterCat && p.category_id !== parseInt(filterCat)) return false;
    if (search && !p.name.toLowerCase().includes(search.toLowerCase()) && !p.sku.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const set = (k, v) => { setForm(f => ({ ...f, [k]: v })); setErrors(e => ({ ...e, [k]: "" })); };

  function validate() {
    const e = {};
    if (!form.sku.trim())       e.sku  = "SKU is required";
    if (!form.name.trim())      e.name = "Name is required";
    if (!form.category_id)      e.category_id = "Select a category";
    if (!form.unit.trim())      e.unit = "Unit is required";
    if (!form.min_stock || parseInt(form.min_stock) < 0) e.min_stock = "Enter a valid minimum stock";
    if (products.find(p => p.sku.toLowerCase() === form.sku.trim().toLowerCase())) e.sku = "SKU already exists";
    return e;
  }

  function handleAdd(e) {
    e.preventDefault();
    const errs = validate();
    if (Object.keys(errs).length) { setErrors(errs); return; }
    setProducts(p => [...p, {
      id: Date.now(), sku: form.sku.trim().toUpperCase(),
      name: form.name.trim(), category_id: parseInt(form.category_id),
      unit: form.unit.trim(), min_stock: parseInt(form.min_stock),
    }]);
    setShowAdd(false);
    setForm({ sku: "", name: "", category_id: "", unit: "pcs", min_stock: "5" });
  }

  return (
    <div className="fade-in">
      <PageHeader title="Products" subtitle="Manage the product catalogue" action={
        <button className="btn-primary" onClick={() => setShowAdd(s => !s)}
          style={{ ...btnPrimary, display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name="plus" size={14} /> {showAdd ? "Cancel" : "Add Product"}
        </button>
      } />

      <div style={{ display: "flex", gap: 12, marginBottom: 16, alignItems: "center" }}>
        <div style={{ position: "relative", flex: 1, maxWidth: 320 }}>
          <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "var(--c-text-soft)" }}>
            <Icon name="search" size={15} />
          </span>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search by name or SKU…" style={{ ...inputStyle, paddingLeft: 36 }} />
        </div>
        <select value={filterCat} onChange={e => setFilterCat(e.target.value)} style={{ ...inputStyle, width: 200 }}>
          <option value="">All categories</option>
          {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>

      {showAdd && (
        <div style={{ background: "var(--c-surface)", borderRadius: "var(--r-lg)", border: "1px solid var(--c-border)", padding: 20, marginBottom: 20, boxShadow: "var(--shadow-sm)" }}>
          <div style={{ fontFamily: "var(--font-head)", fontSize: 15, fontWeight: 600, marginBottom: 16 }}>Add new product</div>
          <form onSubmit={handleAdd}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 14 }}>
              <FormField label="SKU *" error={errors.sku}>
                <input value={form.sku} onChange={e => set("sku", e.target.value)} placeholder="e.g. ELEC-005" style={inputStyle} />
              </FormField>
              <FormField label="Name *" error={errors.name}>
                <input value={form.name} onChange={e => set("name", e.target.value)} placeholder="Product name" style={inputStyle} />
              </FormField>
              <FormField label="Category *" error={errors.category_id}>
                <select value={form.category_id} onChange={e => set("category_id", e.target.value)} style={inputStyle}>
                  <option value="">— Select —</option>
                  {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </FormField>
              <FormField label="Unit *" error={errors.unit}>
                <input value={form.unit} onChange={e => set("unit", e.target.value)} placeholder="pcs / kg / litre" style={inputStyle} />
              </FormField>
              <FormField label="Min Stock *" error={errors.min_stock}>
                <input type="number" min="0" value={form.min_stock} onChange={e => set("min_stock", e.target.value)} style={inputStyle} />
              </FormField>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button type="submit"  className="btn-primary"   style={btnPrimary}>Save Product</button>
              <button type="button"  className="btn-secondary" style={btnSecondary} onClick={() => { setShowAdd(false); setErrors({}); }}>Cancel</button>
            </div>
          </form>
        </div>
      )}

      <Table
        columns={[
          { key: "sku",      label: "SKU"      },
          { key: "name",     label: "Name"     },
          { key: "category", label: "Category" },
          { key: "stock",    label: "Stock", right: true },
          { key: "unit",     label: "Unit"     },
          { key: "min",      label: "Min",   right: true },
          { key: "status",   label: "Status"   },
        ]}
        rows={filtered.map(p => {
          const cat = categories.find(c => c.id === p.category_id);
          const s   = stock[p.id] ?? 0;
          return {
            sku:      <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--c-text-muted)" }}>{p.sku}</span>,
            name:     <span style={{ fontWeight: 500 }}>{p.name}</span>,
            category: cat?.name || "—",
            stock:    <span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, color: s <= p.min_stock ? "var(--c-warning)" : "var(--c-success)" }}>{s}</span>,
            unit:     p.unit,
            min:      p.min_stock,
            status:   <Badge type={s <= p.min_stock ? "LOW" : "OK"} />,
          };
        })}
        emptyMsg="No products found"
      />
    </div>
  );
}

// TOP BAR
// ════════════════════════════════════════════════════════════════════════════
function TopBar({ page }) {
  const labels = { dashboard: "Dashboard", entry: "Stock Entry", writedown: "Write-Down", report: "Stock Report", products: "Products" };
  return (
    <div style={{
      padding: "14px 28px",
      background: "var(--c-surface)",
      borderBottom: "1px solid var(--c-border)",
      display: "flex", alignItems: "center", justifyContent: "space-between",
      flexShrink: 0,
    }}>
      <div style={{ fontSize: 12.5, color: "var(--c-text-muted)", display: "flex", alignItems: "center", gap: 8 }}>
        <span>Stockwell</span>
        <span style={{ color: "var(--c-text-soft)" }}>/</span>
        <span style={{ color: "var(--c-text)", fontWeight: 500 }}>{labels[page]}</span>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        <button style={{
          background: "var(--c-surface-alt)", border: "1px solid var(--c-border)",
          width: 34, height: 34, borderRadius: 8,
          display: "flex", alignItems: "center", justifyContent: "center",
          cursor: "pointer", position: "relative",
        }}>
          <Icon name="bell" size={15} color="var(--c-text-muted)" />
          <span style={{
            position: "absolute", top: 7, right: 8,
            width: 7, height: 7, borderRadius: "50%",
            background: "var(--c-accent)", border: "1.5px solid var(--c-surface-alt)",
          }}></span>
        </button>
        <div style={{ fontSize: 12.5, color: "var(--c-text-muted)" }}>
          <span style={{ color: "var(--c-text)" }}>{CURRENT_USER.email}</span>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════
// ROOT APP
// ════════════════════════════════════════════════════════════════════════════
function App() {
  const [loggedIn, setLoggedIn] = useState(false);
  const [page, setPage]         = useState("dashboard");
  const [products,  setProducts]  = useState(INITIAL_PRODUCTS);
  const [movements, setMovements] = useState(INITIAL_MOVEMENTS);
  const [toast, setToast] = useState(null);

  function showToast(msg, type = "success") {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  }

  if (!loggedIn) return <LoginPage onLogin={() => setLoggedIn(true)} />;

  const pageProps = { products, setProducts, movements, setMovements, categories: CATEGORIES, showToast };

  return (
    <div style={{ display: "flex", width: "100%", height: "100vh" }}>
      <Sidebar page={page} setPage={setPage} onLogout={() => { setLoggedIn(false); setPage("dashboard"); }} />

      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        <TopBar page={page} />
        <main style={{ flex: 1, overflow: "auto", padding: "28px 32px", background: "var(--c-bg)" }}>
          {page === "dashboard" && <DashboardPage {...pageProps} setPage={setPage} />}
          {page === "entry"     && <StockEntryPage {...pageProps} />}
          {page === "writedown" && <WriteDownPage  {...pageProps} />}
          {page === "report"    && <ReportPage products={products} movements={movements} categories={CATEGORIES} />}
          {page === "products"  && <ProductsPage   {...pageProps} />}
        </main>
      </div>

      {toast && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
